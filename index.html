  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px;height:5px;width:82%;border-radius:3px;background:#E6E6E1\"><\u002Fdiv><div style=\"margin-top:6px;height:5px;width:58%;border-radius:3px;background:#E6E6E1\"><\u002Fdiv><div style=\"margin-top:10px;height:84px;border-radius:8px;background:#D4F84A\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:28px 0 0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.025em;text-wrap:balance\">See exactly what your audience will see<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:#5A5A55\">Pixel-true previews for every channel, with character limits and the “see more” fold marked before you hit publish.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"display:flex;flex-direction:column;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid #E6E6E1\">\n          <div style=\"position:relative;height:180px;border-radius:16px;background:#F5F5F2;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;padding:0 24px;display:flex;flex-direction:column;justify-content:center;gap:10px\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;color:#5A5A55\">VERSIONS<\u002Fdiv>\n              <sc-for list=\"{{ fVersions }}\" as=\"v\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ v.pick }}\" aria-pressed=\"{{ v.sel }}\" style=\"display:flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 6px;border-radius:999px;background:{{ v.bg }};color:{{ v.fg }};border:1px solid {{ v.bd }};font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:background .2s cubic-bezier(.2,0,0,1),color .2s cubic-bezier(.2,0,0,1)\">\n                  <span style=\"flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:{{ v.tag }};color:#0B0B0B;font-size:11px;font-weight:700;transition:background .2s cubic-bezier(.2,0,0,1)\">{{ v.id }}< px;background:#FFFFFF;border:1px solid #E6E6E1;color:#5A5A55\"><span style=\"display:grid\">{{ ic.clock }}<\u002Fspan><span style=\"flex:1;font-size:13.5px;font-weight:600\">Bluesky<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11.5px\">Tue 12:00<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:28px 0 0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.025em;text-wrap:balance\">Post at the moment it matters<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:#5A5A55\">Once it’s approved, schedule it for every channel in one go. Draftic publishes on time, so you don’t have to be online.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"display:flex;flex-direction:column;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid #E6E6E1\">\n          <div style=\"position:relative;height:180px;border-radius:16px;background:#F5F5F2;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;padding:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px\">\n              <div>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;color:#5A5A55\">IMPRESSIONS<\u002Fdiv>\n                <div style=\"margin-top:6px;font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1\">12.4k<\u002Fdiv>\n                <span style=\"margin-top:10px;display:inline-block;padding:3px 9px;border-radius:999px;background:#EEFBC2;color:#3D5200;font-size:11.5px;font-weight:700\">+38% vs. last post<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:5px;height:124px\">\n                <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                  <span style=\"width:11px;height:{{ b.h }};border-radius:3px;background:{{ b.bg }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:28px 0 0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.025em;text-wrap:balance\">Learn what actually lands<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:#5A5A55\">Impressions, clicks, comments and reposts per post, per channel, so the next draft starts smarter.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"display:flex;flex-direction:column;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid #E6E6E1\">\n          <div style=\"position:relative;height:180px;border-radius:16px;background:#F5F5F2;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;padding:0 24px;display:flex;flex-direction:column;justify-content:center;gap:8px\">\n              <div style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 6px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E6E1\"><img src=\"9867cff9-8dc4-4aca-b5f6-4168cd775608\" alt=\"\" style=\"width:28px;height:28px;border-radius:50%;object-fit:cover\"><span style=\"flex:1;font-size:13px;font-weight:600\">Priya · Client<\u002Fspan><span style=\"display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#E3F3E9;color:#1F7A45;font-size:11.5px;font-weight:700\">{{ ic12.check }}Approved<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 6px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E6E1\"><img src=\"6ce6301e-4c09-4451-9555-41caf2de7f9d\" alt=\"\" style=\"width:28px;height:28px;border-radius:50%;object-fit:cover\"><span style=\"flex:1;font-size:13px;font-weight:600\">Sam · Founder<\u002Fspan><span style=\"display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#E3F3E9;color:#1F7A45;font-size:11.5px;font-weight:700\">{{ ic12.check }}Approved<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 6px;border-radius:999px;background:#FFFFFF;border:1px dashed #C4C2BC\"><img src=\"d57beaa4-01f0-4ab2-ac9b-cc9af5d1e4a6\" alt=\"\" style=\"width:28px;height:28px;border-radius:50%;object-fit:cover\"><span style=\"flex:1;font-size:13px;font-weight:600;color:#5A5A55\">Arjun · Legal<\u002Fspan><span style=\"display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#F5F5F2;color:#8A4B06;font-size:11.5px;font-weight:700\">{{ ic12.clock }}Pending<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:28px 0 0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.025em;text-wrap:balance\">Know who said yes<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:#5A5A55\">Ask one person or five for sign-off. Every draft shows who approved, who’s pending and which version they saw.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"display:flex;flex-direction:column;padding:28px;border-radius:20px;background:#FFFFFF;border:1px solid #E6E6E1\">\n          <div style=\"position:relative;height:180px;border-radius:16px;background:#F5F5F2;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;padding:0 24px;display:flex;flex-direction:column;justify-content:center;gap:14px\">\n              <div style=\"display:flex;align-items:center\">\n                <img src=\"1350c596-e35a-44e5-b5c4-77a6298d4d16\" alt=\"\" style=\"width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #F5F5F2\">\n                <img src=\"6205889e-34f1-4695-b258-a9d61b5c86c6\" alt=\"\" style=\"width:40px;height:40px;margin-left:-10px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #F5F5F2\">\n                <img src=\"e212e4eb-7971-4f51-a97f-9f78adda51b4\" alt=\"\" style=\"width:40px;height:40px;margin-left:-10px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #F5F5F2\">\n                <span style=\"display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border-radius:50%;background:#D4F84A;box-shadow:0 0 0 3px #F5F5F2;font-size:12px;font-weight:700\">+9<\u002Fspan>\n                <span style=\"margin-left:14px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.06em;color:#5A5A55\">4 WRITERS · 12 REVIEWERS<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;height:40px;padding:0 4px 0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E6E1\">\n                <span style=\"flex:1;min-width:0;font-size:13px;color:#3A3A38;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">alex@studio.co<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:#5A5A55\">Editor {{ ic12.chevronDown }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:#0B0B0B;color:#FFFFFF;font-size:12.5px;font-weight:600\">{{ ic12.userPlus }}Invite<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:28px 0 0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.025em;text-wrap:balance\">Bring the whole team in<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:#5A5A55\">Invite writers and editors into shared workspaces. Roles keep who can publish separate from who can comment.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ USE CASES ============ -->\n  <section id=\"use-cases\" style=\"padding:clamp(80px,10vw,128px) clamp(20px,5vw,64px)\">\n    <div style=\"max-width:1200px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px\">\n        <div style=\"max-width:900px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#5A5A55;white-space:nowrap\">WHO IT’S FOR<\u002Fdiv>\n          <h2 style=\"margin:16px 0 0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:clamp(38px,5.4vw,68px);line-height:1;letter-spacing:-.04em;text-wrap:balance\">Built for people who <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:0\">don’t post alone.<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <div role=\"tablist\" aria-label=\"Use cases\" style=\"display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:#F5F5F2;border:1px solid #E6E6E1\">\n          <sc-for list=\"{{ useCases }}\" as=\"u\" hint-placeholder-count=\"3\">\n            <button role=\"tab\" aria-selected=\"{{ u.sel }}\" sc-camel-on-click=\"{{ u.pick }}\" style=\"height:40px;padding:0 16px;border-radius:8px;background:{{ u.bg }};color:{{ u.fg }};border:1px solid {{ u.bd }};font-size:14px;font-weight:600;cursor:pointer;transition:background .12s cubic-bezier(.2,0,0,1)\">{{ u.tab }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"margin-top:40px;border-radius:20px;border:1px solid #E6E6E1;padding:clamp(24px,4vw,48px);display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);align-items:center\">\n        <div key=\"{{ ucKey }}\" style=\"flex:1 1 360px;min-width:0;animation:dhIn .32s cubic-bezier(.2,0,0,1) both\">\n          <h3 style=\"margin:0;font-family:'Instrument Sans',sans-serif;font-size:clamp(24px,2.6vw,36px);font-weight:600;line-height:1.1;letter-spacing:-.03em\">{{ uc.title }}<\u002Fh3>\n          <p style=\"margin:16px 0 0;font-size:16px;line-height:1.6;color:#5A5A55\">{{ uc.body }}<\u002Fp>\n          <ul style=\"margin:24px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ uc.points }}\" as=\"pt\" hint-placeholder-count=\"3\">\n              <li style=\"display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.5\"><span style=\"display:grid;margin-top:2px\">{{ ic.check }}<\u002Fspan>{{ pt }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 360px;min-width:0;border-radius:16px;background:#F5F5F2;padding:clamp(20px,3vw,28px);display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#5A5A55;white-space:nowrap\">TYPICAL FLOW<\u002Fdiv>\n          <sc-for list=\"{{ uc.flow }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:10px;background:{{ f.bg }};color:{{ f.fg }};border:1px solid {{ f.bd }}\">\n              <span style=\"display:grid\">{{ f.icon }}<\u002Fspan>\n              <span style=\"flex:1;font-size:14px;font-weight:600\">{{ f.label }}<\u002Fspan>\n              <span style=\"font-size:12px;font-weight:600;opacity:.75\">{{ f.who }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PRICING TEASER ============ -->\n  <section id=\"pricing\" style=\"padding:0 clamp(20px,5vw,64px)\">\n    <div data-reveal=\"\" style=\"max-width:1200px;margin:0 auto;border-radius:20px;background:#F5F5F2;border:1px solid #E6E6E1;padding:clamp(28px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px\">\n      <div style=\"max-width:620px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#5A5A55;white-space:nowrap\">PRICING<\u002Fspan><\u002Fdiv>\n        <h2 style=\"margin:16px 0 0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,36px);line-height:1.1;letter-spacing:-.03em;text-wrap:balance\">Pay for the people who write. <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:0\">Reviewers are free.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:12px 0 0;font-size:16px;line-height:1.6;color:#5A5A55\">Start free with unlimited drafts. Upgrade when you add channels or teammates, magic-link reviewers never take a seat.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <a href=\"#start\" style=\"display:flex;align-items:center;gap:12px;height:48px;padding:0 22px;border-radius:12px;background:#0B0B0B;color:#FFFFFF;font-size:16px;font-weight:600\" style-hover=\"background:#2A2A2A;color:#FFFFFF\">Start free <span data-arw=\"\" style=\"display:grid;place-items:center;width:26px;height:26px;margin-right:-10px;border-radius:50%;background:#D4F84A;color:#0B0B0B;transition:transform .28s cubic-bezier(.2,.9,.3,1.3)\">{{ ic.arrowRight }}<\u002Fspan><\u002Fa>\n        <a href=\"https://nilxcy.github.io/pricing-draftic-1/\" style=\"display:flex;align-items:center;height:48px;padding:0 20px;border-radius:10px;background:#FFFFFF;border:1px solid #0B0B0B;font-size:16px;font-weight:600\" style-hover=\"background:#FFFFFF\">Compare plans<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FAQ ============ -->\n  <section id=\"faq\" style=\"padding:clamp(80px,10vw,128px) clamp(20px,5vw,64px)\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,72px);align-items:flex-start\">\n      <div data-reveal=\"\" style=\"flex:1 1 300px;max-width:400px\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:#5A5A55;white-space:nowrap\">FAQ<\u002Fdiv>\n        <h2 style=\"margin:16px 0 0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:clamp(38px,5.4vw,68px);line-height:1;letter-spacing:-.04em\">Questions, <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:0\">answered.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:16px 0 0;font-size:16px;line-height:1.6;color:#5A5A55\">Anything else goes to <a href=\"mailto:support@draftic.social\" style=\"color:#0B0B0B;font-weight:600;text-decoration:underline;text-decoration-color:#D4F84A;text-decoration-thickness:2px;text-underline-offset:4px\">support@draftic.social<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"flex:2 1 420px;min-width:0;display:flex;flex-direction:column;border-top:1px solid #E6E6E1\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n          <div style=\"border-bottom:1px solid #E6E6E1\">\n            <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.expanded }}\" style=\"width:100%;display:flex;align-items:center;gap:16px;min-height:72px;padding:16px 0;text-align:left;cursor:pointer\">\n              <span style=\"flex:1;font-family:'Instrument Sans',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.01em\">{{ q.q }}<\u002Fspan>\n              <span style=\"flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid #E6E6E1;transform:{{ q.rot }};transition:transform .2s cubic-bezier(.2,0,0,1)\">{{ ic.chevronDown }}<\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"display:grid;grid-template-rows:{{ q.rows }};transition:grid-template-rows .32s cubic-bezier(.2,0,0,1)\">\n              <div style=\"overflow:hidden\"><p style=\"margin:0;padding:0 52px 24px 0;font-size:16px;line-height:1.6;color:#5A5A55\">{{ q.a }}<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FINAL CTA + FOOTER ============ -->\n  <section id=\"start\" style=\"background:#0B0B0B;color:#FFFFFF;padding:cla
